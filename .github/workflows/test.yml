# Runs the suite on the Node version production actually serves on.
#
# This exists because there is no version manager on the machine this code
# is written on: local Node is 24, Railway runs 22.23.2, and .nvmrc only
# helps someone who has nvm or fnm installed. Rather than putting a version
# manager on a laptop to close that gap, the check runs where the version
# is free to choose.
#
# No secrets and no services. The suite is pure — verified by running it
# with an empty environment — so anything that needs a database or an API
# key is deliberately not covered here and still has to be checked against
# the live system by hand.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches Railway and Vercel. Keep this in step with engines in package.json
          # and .nvmrc when production moves.
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm test
